[package]
name = "neis-client"
version = "1.1.1"
edition = "2024"
description = "나이스 교육정보 개방 포털 API client"
readme = "README.md"
homepage = "https://github.com/rubymix/neis-client"
repository = "https://github.com/rubymix/neis-client"
license-file = "LICENSE"

[dependencies]
form_urlencoded = "1.2"
serde = { version = "1.0", features = ["derive"] }

http-body-util = { version = "0.1", optional = true }
hyper = { version = "1", optional = true }
hyper-tls = { version = "0.6", optional = true }
hyper-util = { version = "0.1", features = ["client", "http1"], optional = true }
serde_json = { version = "1.0", optional = true }
tracing = { version = "0.1", optional = true }

[target.'cfg(target_env = "musl")'.dependencies]
hyper-tls = { version = "0.6", features = ["vendored"], optional = true }

[dev-dependencies]
tokio = { version = "1", default-features = false, features = ["macros"] }

[features]
default = ["client"]
client = ["dep:http-body-util", "dep:hyper", "dep:hyper-tls", "dep:hyper-util", "dep:serde_json", "dep:tracing"]
